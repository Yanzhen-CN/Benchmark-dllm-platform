[project]
name = "benchmark-dllm-platform"
version = "0.1.0"
description = "Lightweight Streamlit control and results UI for Benchmark-dllm."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.39,<2",
    "pyyaml>=6.0",
    "plotly>=6.0,<7",
    "pillow>=10,<13",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["platform_core*"]
